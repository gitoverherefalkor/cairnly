
project_id = "pcoyafgsirrznhmdaiji"

[functions.create-checkout]
verify_jwt = false

[functions.payment-success]
verify_jwt = false

# Stripe webhook for refund / dispute events. Auth is via stripe-signature
# header verification inside the function — Stripe never sends a JWT, so
# gateway JWT verification must be off.
[functions.stripe-refund-webhook]
verify_jwt = false

# process-referral-payouts is intentionally NOT listed here — it relies on the
# default verify_jwt = true so the Supabase gateway validates the service_role
# JWT that pg_cron sends in the Authorization header.

[functions.forward-to-n8n]
verify_jwt = true

[functions.verify-access-code]
verify_jwt = false

# Identifies the caller from their JWT inside the function (via getUser), so
# gateway verify_jwt stays off — consistent with the publishable-key note below.
[functions.get-my-access-code]
verify_jwt = false

# Signup happens BEFORE the user has a session, so the function must run
# without JWT verification. Defaults to true otherwise, which broke after
# the anon key migrated from JWT format to sb_publishable_* — the gateway
# now rejects publishable-key Authorization headers with
# UNAUTHORIZED_INVALID_JWT_FORMAT on verify_jwt=true functions.
[functions.signup-with-access-code]
verify_jwt = false

[functions.send-confirmation-email]
verify_jwt = false

[functions.forward-resume-to-n8n]
verify_jwt = true

[functions.analysis-completed]
verify_jwt = false

# Server-to-server only (n8n shared secret auth), like analysis-completed.
[functions.translate-section]
verify_jwt = false

[functions.parse-resume-ai]
verify_jwt = false

[functions.send-reminder-email]
verify_jwt = false

# search-jobs: called by logged-in users only. The JWT is verified INSIDE the
# function via getAuthenticatedUser, which also re-checks that report_id belongs
# to the caller before spending any of their free searches. Gateway verify_jwt
# stays off to avoid the publishable-key rejection issue noted on
# signup-with-access-code above — it is NOT an anonymous endpoint.
[functions.search-jobs]
verify_jwt = false

# ensure-referral-code: called by logged-in users only. Same pattern as
# search-jobs above — JWT verified in-function via getAuthenticatedUser, gateway
# verify_jwt off only because of the publishable-key rejection issue.
[functions.ensure-referral-code]
verify_jwt = false

[functions.delete-user-data]
verify_jwt = true

[functions.export-user-data]
verify_jwt = true

[auth]
site_url = "https://cairnly.io"
# Mirrors Authentication -> URL Configuration in the Supabase dashboard, which is
# the source of truth for the hosted project. Synced by hand; last verified
# 2026-09-21. The wildcards cover every app route we hand to `redirectTo`
# (currently /auth/confirm and /reset-password). The two supabase.co entries are
# the provider callback LinkedIn/Google redirect to and the auth-callback
# function. Dev runs on port 8080 (see vite.config.ts), not 3000.
additional_redirect_urls = [
  "https://cairnly.io/**",
  "https://www.cairnly.io/**",
  "http://localhost:8080*",
  "https://pcoyafgsirrznhmdaiji.supabase.co/auth/v1/callback",
  "https://pcoyafgsirrznhmdaiji.supabase.co/functions/v1/auth-callback",
]

[auth.email]
enable_confirmations = true

[auth.email.template.confirmation]
# Superseded in production by the send_email auth hook (the
# send-confirmation-email function), which builds its own EN/NL subjects. This
# value only applies to a local stack with that hook off, so it is kept matching
# the function's English subject rather than naming a product that no longer
# exists.
subject = "Confirm Your Cairnly Account"
content_path = "./supabase/templates/confirmation.html"

# Auth hooks are configured in Supabase dashboard
# [auth.hooks.send_email]
# enabled = true
# uri = "https://pcoyafgsirrznhmdaiji.supabase.co/functions/v1/send-confirmation-email"
# secrets = ["SEND_EMAIL_HOOK_SECRET"]

[functions.submit-support-request]
verify_jwt = false

# Transcript cleanup is for logged-in users only — keep the JWT check on so the
# Gemini call cannot be hit anonymously.
[functions.clean-transcript]
verify_jwt = true

# Résumé Strengthen coaching layer — called by logged-in users only.
[functions.resume-strengthen]
verify_jwt = true

# Landing-page intake chat — anonymous visitors, no JWT exists yet. Abuse is
# fenced inside the function (rate limit, turn caps, token budget).
[functions.intake-chat]
verify_jwt = false

# Called by headless Chromium inside the Vercel PDF renderer, which has no
# Supabase session. Auth is the single-use render token checked in-function.
[functions.report-print-data]
verify_jwt = false

# Report PDF orchestrator. Requires a real user JWT — ownership of the report
# is re-checked inside the function.
[functions.render-report-pdf]
verify_jwt = true

# Partner landing page (/p/:slug). The candidate has no account yet, so this
# is anonymous; it returns only the partner's name, logo and credit line, and
# is rate-limited in-function.
[functions.partner-public]
verify_jwt = false

# Server-to-server hit log for outreach links: called by the Vercel Edge
# Middleware (middleware.ts) when /demo is opened with a utm_content, so there
# is no user JWT. The function only accepts requests that carry utm_content,
# is rate-limited, and can do nothing but insert into outreach_clicks.
[functions.outreach-click]
verify_jwt = false

# Outreach mail sync: called by n8n WF11 (schedule + Gmail), not by a user, so
# no JWT. Gated by the x-shared-secret header (N8N_SHARED_SECRET), same as the
# other n8n → Supabase calls. Reads outreach_prospects, writes outreach_mails,
# advances statuses through outreach_advance_status, mints a test code through
# outreach_code_request when a bureau asks for one. Never sends mail.
[functions.outreach-mail-sync]
verify_jwt = false

# Outreach send: called by n8n WF12 on a schedule, not by a user, so no JWT.
# Same x-shared-secret gate as the sync. It hands out at most one already
# written Gmail draft per call and records the result; every pacing rule
# (window, daily cap, gap, kill switch) lives in outreach_send_claim() in the
# database, so polling harder cannot send more mail.
[functions.outreach-send]
verify_jwt = false

# Outreach prepare: called by pg_cron (07:30 and 14:45 Amsterdam, working
# days), not by a user, so no JWT. Same x-shared-secret gate as the other
# outreach functions (vault 'n8n_shared_secret' = N8N_SHARED_SECRET). Writes
# outreach concepts (first mails, chases, check-ins) and queues the ones the
# auto-approve rule allows; it never sends mail itself.
[functions.outreach-prepare]
verify_jwt = false

# Ops push: called by pg_cron for the morning and afternoon digest and the
# paused-queue alarm, so no JWT. Same x-shared-secret gate. Sends Web Push to
# the admin subscriptions in ops_push_subscriptions and nothing else.
[functions.ops-push]
verify_jwt = false

# Daily Google Ads push: called by a Google Ads Script, which cannot hold a
# Supabase session, so no JWT. Gated by its own x-shared-secret header
# (GOOGLE_ADS_INGEST_SECRET, deliberately NOT N8N_SHARED_SECRET, so the value
# sitting inside Google Ads cannot reach the n8n endpoints). Fails closed when
# the secret is unset, and can do nothing but upsert the google_ads_* tables.
[functions.google-ads-ingest]
verify_jwt = false
